[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renglo-gmail"
version = "1.0.3rc2"
description = "Gmail agent inbox channel for Renglo — OAuth connect, LINK gating, poll inbound, threaded reply"
authors = [
    {name = "NOMA Team"}
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gmail*"]

[tool.setuptools.package-data]
"*" = ["blueprints/*.json"]
